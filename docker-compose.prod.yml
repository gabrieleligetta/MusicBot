services:
  # ---------------------------------------------------------------------------
  # SERVIZIO 1: POT Token Provider (Server)
  # ---------------------------------------------------------------------------
  pot-provider:
    image: ghcr.io/jim60105/bgutil-pot:latest
    container_name: yt-dlp-pot-provider
    restart: always
    
    # RIMOSSO ENTRYPOINT MANUALE (Causava crash)
    # Usiamo le variabili d'ambiente per configurare il server
    environment:
      - RUST_LOG=info
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=4416
    
    # IN PRODUZIONE: NON esportiamo le porte all'esterno per sicurezza.
    # Il bot ci parlerà tramite la rete interna docker.
    expose:
      - "4416"
      
    networks:
      - musicbot_network

  # ---------------------------------------------------------------------------
  # SERVIZIO 2: MusicBot
  # ---------------------------------------------------------------------------
  musicbot:
    container_name: musicbot
    image: ghcr.io/gabrieleligetta/musicbot:latest
    restart: always
    depends_on:
      - pot-provider
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Ora corrisponde esattamente alla configurazione locale
      - POT_URL=http://pot-provider:4416
    volumes:
      - ./database.sqlite:/usr/src/app/database.sqlite
      - ./Playlists:/usr/src/app/Playlists
      - ./cookies.json:/usr/src/app/cookies.json
      - yt-dlp-cache:/root/.cache/yt-dlp
    networks:
      - musicbot_network

networks:
  musicbot_network:
    driver: bridge

volumes:
  yt-dlp-cache:
