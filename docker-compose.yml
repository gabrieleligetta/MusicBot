services:
  # ---------------------------------------------------------------------------
  # SERVIZIO 1: POT Token Provider (Server)
  # ---------------------------------------------------------------------------
  pot-provider:
    image: ghcr.io/jim60105/bgutil-pot:latest
    container_name: yt-dlp-pot-provider
    restart: always
    # RIMUOVIAMO l'entrypoint manuale che causava l'errore
    # entrypoint: ...  <-- CANCELLA QUESTA RIGA

    # Usiamo le variabili d'ambiente ufficiali per configurare host e porta
    environment:
      - RUST_LOG=info
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=4416

    ports:
      - "4416:4416"
    networks:
      - musicbot_network

  # ---------------------------------------------------------------------------
  # SERVIZIO 2: MusicBot
  # ---------------------------------------------------------------------------
  musicbot:
    container_name: musicbot
    # Usa l'immagine costruita localmente o da GHCR, ma assicurati che abbia le dipendenze pip aggiornate
    image: ghcr.io/gabrieleligetta/musicbot:latest
    build: .
    restart: unless-stopped
    depends_on:
      - pot-provider
    env_file:
      - .env
    environment:
      - POT_URL=http://pot-provider:4416
    volumes:
      - ./database.sqlite:/usr/src/app/database.sqlite
      - ./Playlists:/usr/src/app/Playlists
      - ./cookies.json:/usr/src/app/cookies.json
    networks:
      - musicbot_network

networks:
  musicbot_network:
    driver: bridge
